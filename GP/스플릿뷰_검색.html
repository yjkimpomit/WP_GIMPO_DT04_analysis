
<main class="winbox-layout page-content">
	<div class="page-content__placeholder">
		<div class="splitview">
			<aside class="splitview__pane splitview__pane--sidebar" aria-label="정보 검색">

				<!-- 검색영역 -->
				<form class="filter-panel" method="post" autocomplete="off">
					<div class="filter-panel__header">
						<span class="filter-panel__title">검색</span>
						<button class="filter-panel__toggle" 
								type="button"
								aria-label="정보 검색 접기" 
								aria-expanded="true" 
								aria-controls="filter-panel-fields"></button>
					</div>
					<div class="filter-panel__fields" id="filter-panel-fields">
						<!-- form-field 단위로 반복 -->

						<div class="form-field">
							<label class="form-label" for=""></label>
							<input class="form-control search-icon">
							<input class="form-control" type="text" value="" disabled="">
						</div>

						<fieldset class="form-field">
							<legend class="form-label">검색기간(확정일)</legend>

							<div class="form-control-group">
								<label>
									<span class="visually-hidden">확정 시작일</span>
									<input type="date" class="form-control"
										id="inspectorPeriodStart"
										name="searchPeriodStart">
								</label>

								<label>
									<span class="visually-hidden">확정 종료일</span>
									<input type="date" class="form-control"
										id="inspectorPeriodEnd"
										name="searchPeriodEnd">
								</label>
							</div>
						</fieldset>

						<fieldset class="form-field">
							<legend class="form-label">이상점검결과</legend>
							<div class="form-field__content">
								<label class="form-choice">
									<input type="checkbox" name="abnormal-inspection-result" value="true"> <span>이상점검결과 선택</span>
								</label>
							</div>
						</fieldset>
						
					</div>

					<!-- 검색버튼 -->
					<div class="filter-panel__actions">
						<button type="button" class="button button--primary" onclick="fnWorkRequestSearch();">검색</button>
					</div>
				</form>
			
			</aside>
			<section class="splitview__pane splitview__pane--content result-panel" aria-label="검색 결과">
				<h1 class="page-content__heading"></h1>
				
				<%-- data-grid : 결과 리스트 뷰 --%>
				<div class="result-panel__body" id="">
					
				</div>
			</section>
		</div>
	</div>
</main>
