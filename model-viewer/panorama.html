<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="theme-color" content="#FFFFFF">
	<title>파노라마-김포열병합 DT</title>

	<meta name="description" content="작업-김포열병합 DT 서비스 제공">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- favicon -->
	<link rel="icon" href="favicon.ico" sizes="any">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">

	<link rel="stylesheet" href="./assets/fonts/NotoSansKR/NotoSansKR.css" />
	<link rel="stylesheet" href="./assets/css/reset.css" />
	<link rel="stylesheet" href="./assets/css/panorama.css" />
</head>

<body>
	<ol class="comment">
		<li>
			반응형 참고
			<ul>
				<li>576px 미만: 하단에 위치 > 파노라마 패널 클릭시 is-active 클래스가 추가되면 나타납니다.</li>
				<li>576px 이상: 우측에 항상 나타납니다.</li>
			</ul>
		</li>
	</ol>
	
	<div class="panorama-panel">
		<section class="panorama-section panorama-tree" aria-label="파노라마 트리">
			<header class="panorama-section__header">
				<h2>GIMPO Level Hierarchy</h2>
				<button type="button" class="icon icon--popup-window" aria-label="파노라마 트리 팝업 열기"></button>
			</header>
			<div class="panorama-section__search">
				<div class="panorama-search">
					<div class="panorama-search-field">
						<input type="text" class="panorama-search-input" placeholder="설비검색" aria-label="설비검색">
					</div>
					<div>
						<button type="button" class="panorama-search-button" aria-label="설비 검색">
							<span class="panorama-search-icon" aria-hidden="true"></span>
						</button>
					</div>
				</div>
			</div>
			<div class="panorama-section__body">
				<!-- 
				파노라마 트리 메뉴의 뎁스별 왼쪽 여백은 24*n 만큼 증가됩니다.
				-->
				<div class="panorama-tree__list" role="list" aria-label="설비 목록">
					<div class="panorama-tree__row panorama-tree__row--collapsed" role="listitem">
						<div class="panorama-tree__item">
							<span class="panorama-tree__arrow" aria-hidden="true"></span>
							<div class="panorama-tree__label" title="1F">1F</div>
						</div>
					</div>
					<div class="panorama-tree__row panorama-tree__row--expanded" role="listitem">
						<div class="panorama-tree__item">
							<span class="panorama-tree__arrow" aria-hidden="true"></span>
							<div class="panorama-tree__label" title="2F">2F</div>
						</div>
					</div>
					<div class="panorama-tree__row panorama-tree__row--expanded panorama-tree__row--depth-1"
						role="listitem">
						<div class="panorama-tree__item">
							<span class="panorama-tree__arrow" aria-hidden="true"></span>
							<div class="panorama-tree__label" title="터빈설비">터빈설비</div>
						</div>
					</div>
					<div class="panorama-tree__row panorama-tree__row--depth-2" role="listitem">
						<div class="panorama-tree__item">
							<span class="panorama-tree__tag" aria-hidden="true"></span>
							<div class="panorama-tree__label" title="터빈본체">터빈본체</div>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- 
		지도영역의 높이는 변경 가능합니다.
		현재는 패널 가로크기에 따라 16:9 비율로 나오도록 설정되어 있습니다.
		.panorama-map .panorama-section__body > min-block-size 로 조절가능
		-->
		<section class="panorama-section panorama-map" aria-label="MAP 2D">
			<header class="panorama-section__header">
				<h2>MAP 2D</h2>
				<button type="button" class="icon icon--popup-window" aria-label="MAP 2D 팝업 열기"></button>
			</header>
			<div class="panorama-section__body">
				<div class="panorama-map__area">

					<div class="map-viewer-tools">
						<button type="button" aria-pressed="false" class="map-viewer-tools__item">
							<span class="map-viewer-tools__icon map-viewer-tools__icon--toggle" aria-hidden="true"></span>
							<span class="map-viewer-tools__text">레이블</span>
						</button>

						<span class="map-viewer-tools__item map-viewer-tools__zoom" title="최대 확대">
							<input type="text" class="map-viewer-tools__input" min="0" max="20" value="2" placeholder="2" aria-label="줌 레벨">
						</span>

						<button type="button" aria-pressed="true" class="map-viewer-tools__item">
							<span class="map-viewer-tools__icon map-viewer-tools__icon--follow" aria-hidden="true"></span>
							<span class="map-viewer-tools__text">위치 추적</span>
						</button>

						<button type="button" class="map-viewer-tools__item map-viewer-tools__item--icon" aria-label="현재 위치">
							<span class="map-viewer-tools__icon map-viewer-tools__icon--position" aria-hidden="true"></span>
						</button>
					</div>

				</div>
			</div>
		</section>
	</div>
</body>

</html>
