<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>일일안전작업현황</title>
	<link rel="stylesheet" href="/resources/user/css/winbox-content.css">
	<link rel="stylesheet" href="/resources/user/js/timepicker/jquery.timepicker.min.css">
	<link rel="stylesheet" href="/resources/user/js/daterangepicker/daterangepicker.css">
	<script src="/resources/user/js/jquery/jquery-3.6.1.js"></script>
	<script src="/resources/user/js/daterangepicker/moment/moment-with-locales.min.js"></script>
	<script src="/resources/user/js/daterangepicker/daterangepicker.js"></script>
	<script src="/resources/user/js/timepicker/jquery.timepicker.min.js"></script>
</head>

<body>
	<main class="winbox-layout page-content page-content--popup" id="dailyRiskEntryContent">
		<h1 class="page-content__heading visually-hidden">일일안전작업 신청</h1>

		<div class="alert alert-primary required">
			<p class="text-primary">
				<strong class="text-danger">*</strong> 표시는 필수입력 항목입니다.
			</p>
		</div>

		<form class="form-dialog" method="post" id="dailyRiskEntryForm" name="dailyRiskEntryForm" autocomplete="off">
			<input type="hidden" id="dataType" name="dataType" value="I" />
			<input type="hidden" id="mode" name="mode" value="I" />
			<input type="hidden" id="isrIdx" name="isrIdx" value="" />

			<div class="form-grid form-grid--adaptive">
				<div class="form-field form-field--strong" role="group" aria-labelledby="work-report-field-1">
					<span class="form-label" id="work-report-field-1">* 구분</span>
					<div>
						<div class="form-field__content form-choice-list">
							<div class="form-choice">
								<input type="radio" id="radio_1_mt" name="modelTypeCode" value="TA">
								<label class="form-label _MODEL_TYPE_NAME" for="radio_1_mt">태안</label>
							</div>

						</div>
						<input type="hidden" id="modelTypeName" name="modelTypeName" />
					</div>
				</div>
				<div class="form-field form-field--strong" role="group" aria-labelledby="work-report-field-2">
					<span class="form-label" id="work-report-field-2">* 오더번호</span>
					<div>
						<div class="form-control-group">
							<div class="form-field">
								<label class="visually-hidden" for="orderNoOption">오더번호 검색</label>
								<input type="number" class="form-control form-control--search" id="orderNoOption"
									name="workOrderNo" value="" required maxlength="10">
								<input type="hidden" id="orderNoInput" name="workOrderDescription" value="" disabled>
								<button type="button" class="button button--ghost" id="btnSearchWorkOrder"><span
										class="visually-hidden">검색</span></button>
							</div>

							<div class="form-field">
								<div data-mode="I">
									<div class="form-field__content form-choice-list">
										<label class="form-choice">
											<input type="checkbox" id="withoutOrder">
											<span>오더없이 작성</span>
										</label>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>
				<div class="form-field form-field--subtle" role="group" aria-labelledby="work-report-field-3">
					<span class="form-label" id="work-report-field-3">* 공사감독</span>
					<div>
						<div class="form-control-group">
							<div class="form-field">
								<label class="visually-hidden" for="supvorOption">감독자 검색</label>
								<input type="text" class="form-control form-control--search" list="workSvListOptions"
									id="supvorOption" name="workSvCode" value="" required maxlength="10">
								<button type="button" class="button button--ghost" data-search="supervisor"><span
										class="visually-hidden">검색</span></button>
							</div>
							<div class="form-field">
								<label class="visually-hidden" for="supvorInput">공사감독자명</label>
								<input class="form-control" type="text" id="supvorInput" name="workSvName" value=""
									disabled="">
							</div>
						</div>

						<datalist id="workSvListOptions"></datalist>
					</div>
				</div>
				<div class="form-field form-field--subtle" role="group" aria-labelledby="work-report-field-4">
					<span class="form-label" id="work-report-field-4">* 감독자 연락처</span>
					<div>
						<label class="visually-hidden" for="siteSupvorPhone">감독자 연락처</label>
						<input class="form-control" type="tel" id="siteSupvorPhone" name="workSvTel" value=""
							maxlength="20" placeholder="예)010-1234-5678" required>
					</div>
				</div>
				<div class="form-field form-field--subtle" role="group" aria-labelledby="work-report-field-5">
					<span class="form-label" id="work-report-field-5">* (현장)책임자</span>
					<div>
						<label class="visually-hidden" for="siteManagerOption">현장책임자명 입력</label>
						<input class="form-control" type="text" id="siteManagerOption" name="workSmName" value=""
							maxlength="20" required>
					</div>
				</div>
				<div class="form-field form-field--subtle" role="group" aria-labelledby="work-report-field-6">
					<span class="form-label" id="work-report-field-6">* 책임자 연락처</span>
					<div>
						<label class="visually-hidden" for="siteManagerPhone">현장책임자 연락처</label>
						<input class="form-control" type="tel" id="siteManagerPhone" name="workSmTel" value=""
							maxlength="20" placeholder="예)010-1234-5678" required>
					</div>
				</div>
				<div class="form-field form-field--wide form-field--subtle" role="group" aria-labelledby="work-report-field-7">
					<span class="form-label" id="work-report-field-7">* 작업시간</span>
					<div>
						<div class="form-control-group">
							<div class="form-field">
								<label class="visually-hidden" for="workStartDate">시작일</label>
								<input type="text" class="form-control icon-calendar has-dateRangePicker"
									id="workStartDate" name="workTimeDateStart" value="" required>
							</div>
							<div class="form-field">


								<input type="text" class="form-control" id="workTimeStart" name="workTimeStart" value=""
									required>
								<label class="visually-hidden" for="workTimeStart">시작 시간</label>
								<input type="hidden" id="workTimeHourStart" name="workTimeHourStart" />
								<input type="hidden" id="workTimeMinuteStart" name="workTimeMinuteStart" />
							</div>
							<div class="form-field">
								<span class="form-control-plaintext text-center">~</span>
							</div>
							<div class="form-field">
								<label class="visually-hidden" for="workEndDate">종료일</label>
								<input type="text" class="form-control icon-calendar" id="workEndDate"
									name="workTimeDateEnd" value="" required>
							</div>
							<div class="form-field">


								<input type="text" class="form-control" id="workTimeEnd" name="workTimeEnd" value=""
									required>
								<label class="visually-hidden" for="workTimeEnd">종료 시간</label>
								<input type="hidden" id="workTimeHourEnd" name="workTimeHourEnd" />
								<input type="hidden" id="workTimeMinuteEnd" name="workTimeMinuteEnd" />
							</div>
						</div>
						<script>
							if ('ontouchstart' in window) {
								$('#workStartDate.has-dateRangePicker')
									.attr('readonly', true)
									.on('focus click', function () {
										$(this).blur();
										$(this).data('daterangepicker')?.show();
									});
							}
						</script>

						<div class="date-selection" id="selected-days-wrap" data-mode="I">
							<div class="date-selection--title" id="selected-days-title">선택한 일자(클릭하여 제외/포함):</div>
							<div class="date-selection--body" id="selected-days" role="group" aria-labelledby="selected-days-title" tabindex="0"></div>
							<input type="hidden" id="workDates" name="workDates" required>
						</div>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-8">
					<span class="form-label" id="work-report-field-8">* 감독부서</span>
					<div>
						<div class="form-control-group">
							<div class="form-field">
								<label class="visually-hidden" for="supvDeptOption">감독부서 검색</label>
								<input type="text" class="form-control form-control--search"
									list="workSvDeptListOptions" id="supvDeptOption" name="svDeptCode" value=""
									maxlength="20" required>
								<button type="button" class="button button--ghost" data-search="department"><span
										class="visually-hidden">검색</span></button>
							</div>
							<div class="form-field">
								<label class="visually-hidden" for="supvDeptInput">감독부서명</label>
								<input class="form-control" type="text" id="supvDeptInput" name="svDeptName" value=""
									disabled="">
							</div>
						</div>

						<datalist id="workSvDeptListOptions"></datalist>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-9">
					<span class="form-label" id="work-report-field-9">* 공사구분</span>
					<div>
						<label for="workTypeCode" class="visually-hidden">* 공사구분</label>
						<select class="form-select" id="workTypeCode" name="workTypeCode" required>
							<option value="">선택</option>
							<option value="P">계획예방정비</option>
							<option value="R">경상정비</option>
							<option value="S">별도공사</option>
							<option value="O">위탁용역</option>
							<option value="GENERAL">일반공사</option>
							<option value="SIMPLE">간이공사</option>
							<option value="O/H">OVERHAUL</option>
							<option value="SERVICE">용역공사</option>
							<option value="CONTRACT">단가공사</option>
							<option value="INSTALL">설치조건부구매</option>
						</select>
						<input type="hidden" id="workTypeName" name="workTypeName" value="" />
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-10">
					<span class="form-label" id="work-report-field-10">* 공사/작업명</span>
					<div>
						<label for="workName" class="visually-hidden">공사/작업명</label>
						<textarea class="form-control" placeholder="" id="workName" name="workName" required
							maxlength="150"></textarea>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-11">
					<span class="form-label" id="work-report-field-11">* 작업장소</span>
					<div>
						<label class="visually-hidden" for="workLocation">작업장소</label>
						<input class="form-control" type="text" id="workLocation" name="workLocation" value=""
							maxlength="50" required>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-12">
					<span class="form-label" id="work-report-field-12">* 공사업체명</span>
					<div>
						<label class="visually-hidden" for="workCompanyName">공사업체명</label>
						<input class="form-control" type="text" id="workCompanyName" name="workCompanyName" value=""
							maxlength="150" required>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-13">
					<span class="form-label" id="work-report-field-13">* 위험작업</span>
					<div>
						<div class="form-choice-list">
							<div class="form-choice">
								<input type="checkbox" value="G" id="chkValue1" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue1">일반</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="HW" id="chkValue2" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue2">화기</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="C" id="chkValue3" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue3">밀폐</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="H" id="chkValue4" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue4">고소</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="HO" id="chkValue5" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue5">중량물</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="PO" id="chkValue6" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue6">정전</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="E" id="chkValue7" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue7">굴착</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="D" id="chkValue8" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue8">잠수</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="R" id="chkValue9" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue9">방사선</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="CS" id="chkValue10" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue10">화학물질</label>
							</div>
							<div class="form-choice">
								<input type="checkbox" value="O" id="chkValue11" name="hazardWorkCode">
								<label class="form-label _HAZARD_WORK_NAME" for="chkValue11">기타</label>
							</div>
							<input type="hidden" id="hazardWorkName" name="hazardWorkName" />
						</div>
					</div>
				</div>
				<div class="form-field form-field--wide d-none _HAZARD_WORK_OTHER" role="group" aria-labelledby="work-report-field-14">
					<span class="form-label" id="work-report-field-14">* 기타내용</span>
					<div>
						<label for="hazardWorkOther" class="visually-hidden">기타내용</label>
						<textarea class="form-control" placeholder="" id="hazardWorkOther"
							name="hazardWorkOther"></textarea>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-15">
					<span class="form-label" id="work-report-field-15">* 작업인원(명)</span>
					<div>
						<div class="form-control-group">
							<div class="form-field--inline">
								<label class="form-label text-end" for="worksNumberOnsite">경상: </label>
								<input class="form-control" type="number" id="worksNumberOnsite"
									name="worksNumberOnsite" value="" required>
							</div>
							<div class="form-field--inline">
								<label class="form-label text-end" for="worksNumberOutside">외부: </label>
								<input class="form-control" type="number" id="worksNumberOutside"
									name="worksNumberOutside" value="" required>
							</div>
						</div>
					</div>
				</div>
				<div class="form-field" role="group" aria-labelledby="work-report-field-16">
					<span class="form-label" id="work-report-field-16">* 위험도</span>
					<div>
						<div class="form-field">
							<label for="hazardousWork" class="visually-hidden">* 위험도</label>
							<select class="form-select" id="hazardousWork" name="riskLevel" required>
								<option value="">선택</option>
								<option value="상">상</option>
								<option value="중">중</option>
								<option value="하">하</option>
							</select>
						</div>
					</div>
				</div>
				<div class="form-field form-field--wide" role="group" aria-labelledby="work-report-field-17">
					<span class="form-label" id="work-report-field-17">* 작업단계</span>
					<div>
						<label for="keySteps" class="visually-hidden">작업단계</label>
						<textarea class="form-control" placeholder="" id="keySteps" name="keySteps" required></textarea>
					</div>
				</div>
				<div class="form-field form-field--wide" role="group" aria-labelledby="work-report-field-18">
					<span class="form-label" id="work-report-field-18">* 유해 · 위험요인</span>
					<div>
						<label for="hazards" class="visually-hidden">유해 · 위험요인</label>
						<textarea class="form-control" placeholder="" id="hazards" name="hazards" required></textarea>
					</div>
				</div>
				<div class="form-field form-field--wide" role="group" aria-labelledby="work-report-field-19">
					<span class="form-label" id="work-report-field-19">* 감소대책</span>
					<div>
						<label for="controls" class="visually-hidden">감소대책</label>
						<textarea class="form-control" placeholder="" id="controls" name="controls" required></textarea>
					</div>
				</div>
			</div>

			<div class="buttons">
				<button class="button button--primary" type="submit" id="btnSubmit">저장</button>
				<div data-delete-actions hidden>
					<button class="button button--secondary" type="button" data-remove="D">삭제</button>
					<div data-bulk-delete hidden>
						<button class="button button--danger" type="button" data-remove="DA">일괄 삭제</button>
					</div>
				</div>
			</div>
		</form>

	</main>

	<script>
		// HTML 초기 데이터: 이 스크립트 실행 전에 window.workReportFormConfig를 설정합니다.
		// { mode: 'I' | 'U', data: {...}, hazardList: [{ hazardWorkCode, hazardWorkOther }] }
		var workReportConfig = window.workReportFormConfig || {};
		var workReportData = workReportConfig.data || {};
		var workReportHazards = Array.isArray(workReportConfig.hazardList) ? workReportConfig.hazardList : [];
		var workReportMode = workReportConfig.mode === 'U' ? 'U' : 'I';
		var paramSearchDate = new URLSearchParams(window.location.search).get('paramSearchDate') || '';

		$(function () {
			var form = document.getElementById('dailyRiskEntryForm');
			Array.from(form.elements).forEach(function (field) {
				if (field.type !== 'radio' && field.type !== 'checkbox' && workReportData[field.name] != null) {
					field.value = workReportData[field.name];
				}
			});
			$('#mode').val(workReportMode);
			$('#isrIdx').val(workReportData.isrIdx || '');
			$('[data-mode]').prop('hidden', workReportMode !== 'I');
			$('[data-delete-actions]').prop('hidden', !(Number(workReportData.isrIdx) > 0));
			$('[data-bulk-delete]').prop('hidden', !workReportData.createIdx);
			['Start', 'End'].forEach(function (suffix) {
				var hour = workReportData['workTimeHour' + suffix];
				var minute = workReportData['workTimeMinute' + suffix];
				if (hour != null && minute != null) {
					$('#workTime' + suffix).val(String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0'));
				}
			});
			var other = workReportHazards.find(function (hazard) { return hazard.hazardWorkCode === 'O'; });
			$('#hazardWorkOther').val(other ? other.hazardWorkOther || '' : '');
			form.addEventListener('submit', function (event) {
				event.preventDefault();
				['Start', 'End'].forEach(function (suffix) {
					var parts = $('#workTime' + suffix).val().split(':');
					$('#workTimeHour' + suffix).val(parts[0] || '');
					$('#workTimeMinute' + suffix).val(parts[1] || '');
				});
				$('#modelTypeName').val(form.querySelector('[name=modelTypeCode]:checked')?.labels[0].textContent || '');
				$('#hazardWorkName').val(Array.from(form.querySelectorAll('[name=hazardWorkCode]:checked'), function (field) { return field.labels[0].textContent; }).join(','));
				if (typeof window.fnSaveWorkReport === 'function') window.fnSaveWorkReport();
				else alert('저장 기능은 서버 연동이 필요합니다.');
			});
			$('[data-search]').on('click', function () {
				var handler = this.dataset.search === 'supervisor' ? window.searchItemPopup : window.searchReqTreePopup;
				if (typeof handler === 'function') handler($(this));
				else if (this.dataset.search === 'supervisor' && $('#supvorOption').val().trim()) fnSearchWorkSv($('#supvorOption').val().trim());
				else if (this.dataset.search === 'department' && $('#supvDeptOption').val().trim()) fnSearchWorkSvDept($('#supvDeptOption').val().trim());
				else alert('검색어를 입력해 주세요. 검색 팝업은 서버 연동이 필요합니다.');
			});
			$('[data-remove]').on('click', function () {
				if (typeof window.fnPopWorkReportRemove === 'function') window.fnPopWorkReportRemove(workReportData.isrIdx, this.dataset.remove);
				else alert('삭제 기능은 서버 연동이 필요합니다.');
			});
		});



		/* INIT FORM */
		function fnPopSetInitReportForm() {
			$("#dataType").val("G");

			// 초기화
			var dataType = $("#dataType").val();
			var mode = $("#mode").val();
			var isrIdx = $("#isrIdx").val();
			var modelTypeCode = $("#dailyRiskEntryForm [name=modelTypeCode]:checked").val();
			var orderNoOption = $("#dailyRiskEntryForm #orderNoOption").val();
			var withoutOrder = $("#dailyRiskEntryForm #withoutOrder").is(":checked");
			var supvorOption = $("#dailyRiskEntryForm #supvorOption").val();
			var supvorInput = $("#dailyRiskEntryForm #supvorInput").val();
			var siteSupvorPhone = $("#dailyRiskEntryForm #siteSupvorPhone").val();

						}
						if (item.isQsFire === 'Y') {

							isQsCount++;
						}
						if (item.isQsNarrow === 'Y') {

						if (item.isQsHeavy === 'Y') {

						if (item.isQsElectricity === 'Y') {

						if (item.isQsExcavation === 'Y') {

						if (item.isQsRadiation === 'Y') {

		function setDate() {
			//날짜 현재날짜 기준 한 달 전 세팅
			var today = new Date();
			var yyyy = today.getFullYear();
			var mm = ("0" + (today.getMonth() + 1)).slice(-2);
			var dd = ("0" + today.getDate()).slice(-2);

		/* set datepicker */
		// 선택한 날짜 설정
		var selectedDatesSet = new Set(); // 'YYYY-MM-DD'

		function updateInputFromSet() {
			if (selectedDatesSet.size === 0) {
				$('#workDates').val('');
				$("#btnSubmit").prop("disabled", true);
				alert("모든 작업시간이 제외되었습니다.\n최소 1일은 선택되어야 합니다.");
				return;
			} else {
				$("#btnSubmit").prop("disabled", false);

				// 등록할 날짜를 정렬해서 저장
				var arr = Array.from(selectedDatesSet);
				arr.sort();
				$("#workEndDate").val(arr[arr.length - 1]);
				$('#workDates').val(arr.join(','));
			}
		}

		/* Set date */
		function fnSetDate(t, dateStr) {
			if (selectedDatesSet.has(dateStr)) {
				selectedDatesSet.delete(dateStr);
				t.attr('aria-pressed', 'false');
			} else {
				selectedDatesSet.add(dateStr);
				t.attr('aria-pressed', 'true');
			}
			updateInputFromSet();
		}

		/* 선택한 날짜를 일 생성, 리스트 뷰 */
		function renderSelectedDays(start, end) {
			selectedDatesSet.clear();

			// 날짜 생성
			var cur = start.clone().startOf('day');
			var last = end.clone().startOf('day');
			while (cur.isSameOrBefore(last, 'day')) {
				selectedDatesSet.add(cur.format('YYYY-MM-DD'));
				cur.add(1, 'day');
			}

			var $wrap = $('#selected-days-wrap');
			var $box = $('#selected-days');
			$box.empty();

			/* 날짜 뷰 리스트 */
			Array.from(selectedDatesSet).sort().forEach(function (d) {
				// 칩(label)에는 요일을 함께 표시하되, data-date와 내부 Set 값은 날짜만 유지하여
				var dow = moment(d, 'YYYY-MM-DD').format('ddd'); // 예: 일, 월, 화 ... (ko 로케일)
				var label = d + ' (' + dow + ')';
				var $chip = $('<button type="button" class="button button--light" aria-pressed="true" data-date="' + d + '">' + label + '</button>');

				$chip.on('click', function () {
					var dateStr = $(this).attr('data-date');
					fnSetDate($(this), dateStr);
				});
				$box.append($chip);

				// 토,일 삭제
				if (dow === '토' || dow === '일') {
					selectedDatesSet.delete(d);
					$chip.attr('aria-pressed', 'false');
				}
			});

			$wrap.show();
			updateInputFromSet();
		}

		// 선택일 생성
		function fnSetTimePicker() {
			var drp = $('#workStartDate').data('daterangepicker');
			if (!drp) return;
			drp.setStartDate($("#workStartDate").val());
			drp.setEndDate($("#workEndDate").val());

			if (drp && drp.startDate && drp.endDate) {
				renderSelectedDays(drp.startDate, drp.endDate);
			}
		}

			});

			/* 오더번호 검색 아이콘 클릭 */
			$("#btnSearchWorkOrder").click(function () {
				var workSvName = $("#supvorInput").val();

				fnSearchWorkOrderPopup();
			});

			/* 공사감독 검색 시 */
			$("#supvorOption").on("keypress change", function (e) {
				var checkLen = $(this).val().trim().length;
				var isEnter = (e.key === 'Enter' || e.keyCode === 13);

				if (isEnter || checkLen >= 8) {
					e.preventDefault();

					var $list = $('#workSvListOptions');
					$list.empty(); // 기존 옵션 제거

					var userId = $(this).val().trim();
					if (typeof userId === "undefined" || userId === "") {
						$("#supvorInput").val('');
						return false;
					}

					fnSearchWorkSv(userId);
				}
			});

			/* 감독부서 검색 시 */
			$("#supvDeptOption").on("keypress change", function (e) {
				var checkLen = $(this).val().trim().length;
				var isEnter = (e.key === 'Enter' || e.keyCode === 13);

				if (isEnter || checkLen >= 4) {
					e.preventDefault();

					var $list = $('#workSvDeptListOptions');
					$list.empty(); // 기존 옵션 제거

					var paramDept = $(this).val().trim();
					if (typeof paramDept === "undefined" || paramDept === "") {
						$("#supvDeptInput").val('');
						return false;
					}

					fnSearchWorkSvDept(paramDept);
				}
			});

			if (workReportMode === 'I') {
				/* daterangepicker */
				if (moment && typeof moment.locale === 'function') {
					moment.locale('ko');
				}

				$('#workStartDate').daterangepicker({
					linkedCalendars: false,
					autoUpdateInput: false,
					showCustomRangeLabel: false,
					startDate: moment(),
					endDate: moment(),
					locale: {
						format: 'YYYY-MM-DD',
						separator: ' ~ ',
						applyLabel: '적용',
						cancelLabel: '닫기',
						fromLabel: '시작',
						toLabel: '종료',
						customRangeLabel: 'Custom',
						weekLabel: '주',
						daysOfWeek: ['일', '월', '화', '수', '목', '금', '토'],
						monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
						firstDay: 0
					}
				}, function (start, end, label) {
					$("#workStartDate").val(start.format('YYYY-MM-DD'));
					$("#workEndDate").val(end.format('YYYY-MM-DD'));
					renderSelectedDays(start, end);
					console.log('New date range selected: ' + start.format('YYYY-MM-DD') + ' to ' + end.format('YYYY-MM-DD') + ' (predefined range: ' + label + ')');
				});

				$('#workStartDate').on('show.daterangepicker', function (ev, picker) {
					var $container = picker.container;
					var $buttons = $container.find('.drp-buttons');
					var $cancel = $buttons.find('.cancelBtn');

					// 버튼이 없으면 생성
					if (!$buttons.find('.btn-today').length) {
						var $today = $('<button type="button" class="btn btn-sm btn-default btn-today">오늘</button>')
							.on('click', function () {
								picker.setStartDate(moment());
								picker.setEndDate(moment());
								// 선택 적용까지 수행하려면 아래 한 줄 중 하나 사용
								if (typeof picker.clickApply === 'function') picker.clickApply();
								else $buttons.find('.applyBtn').trigger('click');
							});

						// 닫기 버튼 앞에 삽입 (없으면 버튼 영역 끝에 추가)
						if ($cancel.length) $today.insertBefore($cancel);
						else $today.appendTo($buttons);
					} else {
						// 이미 존재하는 경우에도 항상 닫기 버튼 앞에 위치시키기(재정렬)
						var $today = $buttons.find('.btn-today');
						if ($cancel.length) $today.insertBefore($cancel);
					}
				});

				// 취소 시 초기화
				$('#workStartDate').on('cancel.daterangepicker', function () {
					// no action
				});

				fnSetTimePicker();
			}
		});
	</script>
</body>

</html>
