<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>설비 검색</title>
	<link rel="stylesheet" href="/resources/user/css/winbox-content.css">
</head>

<body>
	<main class="winbox-layout page-content">
		<h1 class="page-content__heading">설비 검색</h1>
		<div class="page-content__placeholder page-content__placeholder--flex">
			<div class="equipment-search" role="search" aria-label="설비 검색">
					<div class="equipment-search__controls">
						<label class="visually-hidden" for="equipment-search">설비 검색</label>
						<select class="form-select equipment-search__type" aria-label="검색 조건">
							<option value="equipment-name">설비</option>
							<option value="tag">부품</option>
						</select>
						<input class="form-control" id="equipment-search" type="search" placeholder="설비번호/설비명 검색">
						<button class="equipment-search__expand-button is-collapsed" type="button"
							aria-label="트리 전체 펼치기"></button>
					</div>
					<div class="tree-explorer__tree" role="region" aria-label="설비 zTree 영역">
						
					</div>
			</div>
		</div>
	</main>
	<script src="/resources/user/js/jquery/jquery-3.6.1.min.js"></script>
	<script src="/resources/user/js/ztree/js/jquery.ztree.core.min.js"></script>
	<script src="/resources/user/js/facility/custom-facility-search.js"></script>
	<script src="/resources/user/js/common/components.js"></script>
</body>

</html>
