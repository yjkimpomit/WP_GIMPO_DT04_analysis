<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>작업현황</title>
	<link rel="stylesheet" href="/resources/css/winbox-content.css">
</head>

<body>
	<main class="winbox-layout page-content tabs tabs--scrollable" data-tabs data-tab-content-loader>
		<h1 class="page-content__heading">작업현황</h1>
		<ul class="nav nav-tabs" id="red-tag-tabs" role="tablist" aria-label="작업현황 메뉴">
			<li class="nav-item" role="presentation"><button class="nav-link active" id="red-tag-issue-tab" data-bs-toggle="tab" data-bs-target="#red-tag-issue-panel" type="button" role="tab" aria-controls="red-tag-issue-panel" aria-selected="true" data-tab-key="issue">Red Tag 발행</button></li>
			<li class="nav-item" role="presentation"><button class="nav-link" id="red-tag-register-tab" data-bs-toggle="tab" data-bs-target="#red-tag-register-panel" type="button" role="tab" aria-controls="red-tag-register-panel" aria-selected="false" data-tab-key="register">Red Tag 관리대장</button></li>
		</ul>
		<div class="tab-content" id="red-tag-tab-content">
			<section class="tab-pane fade show active" id="red-tag-issue-panel" role="tabpanel" aria-labelledby="red-tag-issue-tab" tabindex="0">
				<h2 class="page-content__subheading">Red Tag 발행</h2>
				<p class="status-message">Red Tag 발행 대상과 승인 상태를 조회합니다.</p>
			</section>
			<section class="tab-pane fade" id="red-tag-register-panel" role="tabpanel" aria-labelledby="red-tag-register-tab" tabindex="0">
				<h2 class="page-content__subheading">Red Tag 관리대장</h2>
				<p class="status-message">발행된 Red Tag의 처리 이력을 관리합니다.</p>
			</section>
		</div>
	</main>
	<script src="/resources/vendor/bootstrap-5.3.8/js/bootstrap-tab.js"></script>
	<script src="/resources/js/html-common/tab-content-loader.js"></script>
	<script src="/resources/js/html-common/components.js"></script>
</body>

</html>
