<body class="sub sub--app-main">
	<main class="service-hub" aria-labelledby="service-hub-title">
		<header class="service-hub__header">
			<p class="service-hub__eyebrow">DIGITAL TWIN · SERVICE</p>
			<h1 id="service-hub-title">서비스 바로가기</h1>
		</header>
		<section class="service-hub__section" aria-labelledby="service-hub-core">
			<div class="service-hub__section-heading"><h2 id="service-hub-core">주요 서비스</h2></div>
			<div class="service-hub__grid">
				<button type="button" onclick="fnOpenPopup('/earlywarning/index.do', $(this))" class="service-hub__card" data-title="조기경보">
					<span class="service-hub__card-content"><strong>조기경보</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</button>
				<button type="button" onclick="fnAndroidShowUnity()" class="service-hub__card" data-title="3D모델">
					<span class="service-hub__card-content"><strong>3D 모델</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</button>
			</div>
		</section>
		<section class="service-hub__section" aria-labelledby="service-hub-more">
			<div class="service-hub__section-heading"><h2 id="service-hub-more">현장·운영 서비스</h2></div>
			<div class="service-hub__grid">
				<button type="button" onclick="fnOpenPopup('/dailySafety/index.do?tabIdx=0', $(this))" class="service-hub__card" data-title="일일안전작업현황">
					<span class="service-hub__card-content"><strong>일일안전작업현황</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</button>
				<button type="button" onclick="fnOpenPopup('${panoUrl}', $(this))" data-class="panorama" class="service-hub__card" data-title="파노라마">
					<span class="service-hub__card-content"><strong>파노라마</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</button>
				<article class="service-hub__card" data-title="설비검색">
					<span class="service-hub__card-content"><strong>설비검색</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</article>
				<button type="button" onclick="fnOpenPopup('/serviceinfo/index.do?tabIdx=0', $(this))" class="service-hub__card" data-title="개선사항">
					<span class="service-hub__card-content"><strong>서비스 개선사항</strong></span>
					<span class="service-hub__arrow" aria-hidden="true"></span>
				</button>
			</div>
		</section>
	</main>
</body>

</html>
